<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হারুন অর রশিদ এর কফি শপ</title>
    <!-- Font Awesome & Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: #FAF6F0;
            color: #333;
        }

        /* Navigation Bar */
        header {
            background-color: #2C1810;
            color: #F4EAE1;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: #D4A373;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Container */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        .section-title {
            text-align: center;
            margin: 20px 0 15px;
            color: #6F4E37;
            font-size: 1.8rem;
        }

        /* Category Filter Buttons */
        .category-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .cat-btn {
            background-color: #FFF;
            border: 2px solid #6F4E37;
            color: #6F4E37;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .cat-btn.active, .cat-btn:hover {
            background-color: #6F4E37;
            color: #FFF;
        }

        /* Product Grid & Cards */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #FFF;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border: 1px solid #E6D7C3;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .product-details {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #2C1810;
            margin-bottom: 5px;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #C0392B;
            margin-bottom: 15px;
        }

        .order-btn {
            background-color: #27AE60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .order-btn:hover {
            background-color: #219150;
        }

        /* Order Form Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #FFF;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.4rem;
            cursor: pointer;
            color: #777;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #2C1810;
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #CCC;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            border-color: #6F4E37;
        }

        /* Confirmation View */
        .confirm-box {
            text-align: center;
            padding: 20px 10px;
        }

        .confirm-box i {
            font-size: 3.5rem;
            color: #27AE60;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-mug-hot"></i>
            <span>হারুন অর রশিদ এর কফি শপ</span>
        </div>
    </header>

    <!-- Main Menu Area -->
    <div class="container">
        <h2 class="section-title">মাই মেনু (My Menu)</h2>

        <!-- Category Buttons -->
        <div class="category-container">
            <button class="cat-btn active" onclick="filterCategory('all')">সব আইটেম</button>
            <button class="cat-btn" onclick="filterCategory('hot-coffee')">হট কফি</button>
            <button class="cat-btn" onclick="filterCategory('cold-coffee')">কোল্ড কফি</button>
            <button class="cat-btn" onclick="filterCategory('lassi')">লাচ্ছি</button>
            <button class="cat-btn" onclick="filterCategory('pasta')">পাস্তা</button>
            <button class="cat-btn" onclick="filterCategory('biryani')">বিরিয়ানি</button>
            <button class="cat-btn" onclick="filterCategory('fast-food')">ফাস্ট ফুড</button>
        </div>

        <!-- Product Cards Container -->
        <div class="product-grid" id="productGrid">
            <!-- JavaScript rendering products here -->
        </div>
    </div>

    <!-- Order Form Popup Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeOrderModal()">&times;</span>
            
            <div id="formSection">
                <h3 style="color: #6F4E37; text-align: center; margin-bottom: 15px;">অর্ডার ফর্ম</h3>
                <form id="orderForm" onsubmit="submitOrder(event)">
                    
                    <div class="form-group">
                        <label>পণ্য:</label>
                        <input type="text" id="selectedProduct" class="form-control" readonly style="background: #F0F0F0; font-weight: bold;">
                    </div>

                    <div class="form-group">
                        <label>গ্রাহকের নাম: *</label>
                        <input type="text" required class="form-control" placeholder="আপনার নাম লিখুন">
                    </div>

                    <div class="form-group">
                        <label>মোবাইল নম্বর: *</label>
                        <input type="tel" required class="form-control" placeholder="01XXXXXXXXX">
                    </div>

                    <!-- 1. District Selection Dropdown -->
                    <div class="form-group">
                        <label for="districtSelect">জেলা নির্বাচন করুন: *</label>
                        <select id="districtSelect" class="form-control" required onchange="loadUpazilas()">
                            <option value="">জেলা নির্বাচন করুন</option>
                        </select>
                    </div>

                    <!-- 2. Upazila Selection Dropdown -->
                    <div class="form-group">
                        <label for="upazilaSelect">উপজেলা নির্বাচন করুন: *</label>
                        <select id="upazilaSelect" class="form-control" required disabled>
                            <option value="">প্রথমে জেলা নির্বাচন করুন</option>
                        </select>
                    </div>

                    <!-- 3. Village Manual Typing Field -->
                    <div class="form-group">
                        <label>গ্রামের নাম (টাইপ করুন): *</label>
                        <input type="text" required class="form-control" placeholder="আপনার গ্রামের নাম লিখুন">
                    </div>

                    <!-- 4. Delivery Place/Address Manual Typing Field -->
                    <div class="form-group">
                        <label>পণ্য পাওয়ার জায়গা / ঠিকানা (টাইপ করুন): *</label>
                        <input type="text" required class="form-control" placeholder="যেমন: বাজার, মোড় বা বাড়ির নম্বর">
                    </div>

                    <button type="submit" class="order-btn" style="margin-top: 15px;">
                        <i class="fa-solid fa-check-circle"></i> অর্ডার নিশ্চিত করুন
                    </button>
                </form>
            </div>

            <!-- Order Success Confirmation Message -->
            <div id="successSection" class="confirm-box" style="display: none;">
                <i class="fa-solid fa-circle-check"></i>
                <p style="font-size: 1.1rem; line-height: 1.6; color: #2C1810; margin-bottom: 15px;">
                    আপনার অর্ডারটি কনফার্ম করা হয়েছে, অতি শীঘ্রই আমাদের একজন প্রতিনিধি আপনার সাথে যোগাযোগ করবে। আপনার অর্ডারের জন্য আপনাকে ধন্যবাদ।
                </p>
                <button class="order-btn" onclick="closeOrderModal()">ঠিক আছে</button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================
           1. PRODUCTS DATA (With Pictures & Pricing)
           ========================================== */
        const productsList = [
            { id: 1, category: 'hot-coffee', name: 'এসপ্রেসো হট কফি', price: 120, img: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=500&q=80' },
            { id: 2, category: 'hot-coffee', name: 'ক্যাপুচিনো কফি', price: 180, img: 'https://images.unsplash.com/photo-1534778101976-62847782c213?w=500&q=80' },
            { id: 3, category: 'cold-coffee', name: 'আইসড কোল্ড কফি', price: 200, img: 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=500&q=80' },
            { id: 4, category: 'cold-coffee', name: 'চকলেট কোল্ড কফি', price: 220, img: 'https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=500&q=80' },
            { id: 5, category: 'lassi', name: 'স্পেশাল দই লাচ্ছি', price: 100, img: 'https://images.unsplash.com/photo-1553530666-ba11a7da3888?w=500&q=80' },
            { id: 6, category: 'pasta', name: 'চিকেন হোয়াইট সস পাস্তা', price: 250, img: 'https://images.unsplash.com/photo-1621996346565-e3d5d6281288?w=500&q=80' },
            { id: 7, category: 'biryani', name: 'চিকেন বিরিয়ানি', price: 220, img: 'https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=500&q=80' },
            { id: 8, category: 'biryani', name: 'কাচ্চি বিরিয়ানি', price: 320, img: 'https://images.unsplash.com/photo-1633945274405-b6c8069047b0?w=500&q=80' },
            { id: 9, category: 'fast-food', name: 'চিকেন বার্গার', price: 160, img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=80' },
            { id: 10, category: 'fast-food', name: 'চীজি চিজ পিজ্জা', price: 450, img: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&q=80' }
        ];

        /* ==========================================
           2. BANGLADESH 64 DISTRICTS & UPAZILAS
           ========================================== */
        const locationMap = {
            "চাঁপাইনবাবগঞ্জ": ["নাচোল", "ভোলাহাট", "সদর", "শিবগঞ্জ", "গোমস্তাপুর"],
            "রাজশাহী": ["পবা", "বোয়ালিয়া", "বাঘা", "পুতীয়াসাদ", "চারঘাট", "দুর্গাপুর", "তানোর", "মোহনপুর", "গোদাগাড়ী"],
            "ঢাকা": ["ধানমন্ডি", "মিরপুর", "উত্তরা", "গুলশান", "সাবার", "কেরানীগঞ্জ", "মোহাম্মদপুর"],
            "চট্টগ্রাম": ["পাহাড়তলী", "পাঁচলাইশ", "পটিয়া", "হাটহাজারী", "সীতাকুণ্ড"],
            "বগুড়া": ["বগুড়া সদর", "শেরপুর", "শিবগঞ্জ", "দুপচাঁচিয়া"],
            "সিলেট": ["সিলেট সদর", "শ্রীমঙ্গল", "গোলাপগঞ্জ"]
        };

        // Populate standard 64 districts
        const allBDDistricts = [
            "গাজীপুর", "নারায়ণগঞ্জ", "টাঙ্গাইল", "কিশোরগঞ্জ", "মানিকগঞ্জ", "মুন্সীগঞ্জ", "নরসিংদী", "ফরিদপুর", "গোপালগঞ্জ", "মাদারীপুর", "রাজবাড়ী", "শরীয়তপুর",
            "কুমিল্লা", "ফেনী", "ব্রাহ্মণবাড়িয়া", "নোয়াখালী", "লক্ষ্মীপুর", "চাঁদপুর", "কক্সবাজার", "রাঙ্গামাটি", "বান্দরবান", "খাগড়াছড়ি",
            "খুলনা", "যশোর", "সাতক্ষীরা", "বাগেরহাট", "ঝিনাইদহ", "কুষ্টিয়া", "মাগুরা", "মেহেরপুর", "নড়াইল", "চুয়াডাঙ্গা",
            "পাবনা", "সিরাজগঞ্জ", "নাটোর", "নওগাঁ", "জয়পুরহাট",
            "বরিশাল", "পটুয়াখালী", "ভোলা", "পিরোজপুর", "বরগুনা", "ঝালকাঠি",
            "রংপুর", "দিনাজপুর", "গাইবান্ধা", "কুড়িগ্রাম", "লালমনিরহাট", "নীলফামারী", "পঞ্চগড়", "ঠাকুরগাঁও",
            "মৌলভীবাজার", "হবিগঞ্জ", "সুনামগঞ্জ", "ময়মনসিংহ", "জামালপুর", "নেত্রকোনা", "শেরপুর"
        ];

        allBDDistricts.forEach(d => {
            if (!locationMap[d]) {
                locationMap[d] = [d + " সদর", "উপজেলা ১", "উপজেলা ২"];
            }
        });

        /* ==========================================
           3. DISPLAY PRODUCTS & LOGIC
           ========================================== */
        window.onload = function() {
            displayProducts(productsList);
            initDistricts();
        };

        function displayProducts(items) {
            const container = document.getElementById('productGrid');
            container.innerHTML = '';

            items.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}" class="product-img" alt="${p.name}">
                        <div class="product-details">
                            <div class="product-name">${p.name}</div>
                            <div class="product-price">৳ ${p.price}</div>
                            <button class="order-btn" onclick="openOrderModal('${p.name}')">
                                <i class="fa-solid fa-cart-shopping"></i> অর্ডার করুন
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            // Update button styles
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (cat === 'all') {
                displayProducts(productsList);
            } else {
                const filtered = productsList.filter(item => item.category === cat);
                displayProducts(filtered);
            }
        }

        /* ==========================================
           4. FORM & MODAL LOGIC
           ========================================== */
        function openOrderModal(productName) {
            document.getElementById('selectedProduct').value = productName;
            document.getElementById('orderForm').reset();
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('successSection').style.display = 'none';
            document.getElementById('upazilaSelect').disabled = true;
            document.getElementById('upazilaSelect').innerHTML = '<option value="">প্রথমে জেলা নির্বাচন করুন</option>';
            document.getElementById('orderModal').classList.add('active');
        }

        function closeOrderModal() {
            document.getElementById('orderModal').classList.remove('active');
        }

        function initDistricts() {
            const distSelect = document.getElementById('districtSelect');
            const sortedDistricts = Object.keys(locationMap).sort((a, b) => a.localeCompare(b, 'bn'));

            sortedDistricts.forEach(dist => {
                const opt = document.createElement('option');
                opt.value = dist;
                opt.textContent = dist;
                distSelect.appendChild(opt);
            });
        }

        function loadUpazilas() {
            const distSelect = document.getElementById('districtSelect').value;
            const upazilaSelect = document.getElementById('upazilaSelect');

            upazilaSelect.innerHTML = '<option value="">উপজেলা নির্বাচন করুন</option>';

            if (distSelect && locationMap[distSelect]) {
                upazilaSelect.disabled = false;
                locationMap[distSelect].forEach(up => {
                    const opt = document.createElement('option');
                    opt.value = up;
                    opt.textContent = up;
                    upazilaSelect.appendChild(opt);
                });
            } else {
                upazilaSelect.disabled = true;
                upazilaSelect.innerHTML = '<option value="">প্রথমে জেলা নির্বাচন করুন</option>';
            }
        }

        function submitOrder(e) {
            e.preventDefault();
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('successSection').style.display = 'block';
        }
    </script>
</body>
</html>
