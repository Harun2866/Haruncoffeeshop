<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কফিশপ - প্রোডাক্ট ও চেকআউট</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7f3ef;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* হেডার */
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }

        header h1 {
            color: #4a2c2a;
            font-size: 2.2rem;
        }

        /* কার্ড রেপার */
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 30px;
            margin-bottom: 30px;
        }

        /* ১. প্রোডাক্ট ডিটেইলস সেকশন */
        .product-details {
            display: flex;
            gap: 30px;
            align-items: center;
            flex-wrap: wrap;
        }

        .product-image {
            flex: 1;
            min-width: 250px;
            text-align: center;
        }

        .product-image img {
            width: 100%;
            max-width: 320px;
            border-radius: 10px;
            object-fit: cover;
        }

        .product-info {
            flex: 1.5;
            min-width: 280px;
        }

        .product-title {
            font-size: 1.8rem;
            color: #4a2c2a;
            margin-bottom: 10px;
        }

        .product-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #d97706;
            margin-bottom: 20px;
        }

        /* বাটন গ্রুপ */
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-order {
            background-color: #6f4e37;
            color: #ffffff;
            padding: 12px 28px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-order:hover {
            background-color: #4a2c2a;
        }

        /* হোয়াটসঅ্যাপ বাটন */
        .btn-whatsapp {
            background-color: #25D366;
            color: #ffffff;
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .btn-whatsapp:hover {
            background-color: #128C7E;
        }

        /* ২. চেকআউট সেকশন */
        .checkout-section {
            display: none; /* শুরুতে লুকিয়ে রাখা হয়েছে */
        }

        .section-title {
            color: #4a2c2a;
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #4b5563;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: #6f4e37;
        }

        .btn-submit {
            background-color: #16a34a;
            color: white;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #15803d;
        }

        .btn-back {
            background: none;
            border: none;
            color: #6f4e37;
            cursor: pointer;
            font-size: 0.95rem;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>☕ ক্যাফে ডেলিভারি</h1>
        </header>

        <!-- ১. প্রোডাক্ট ডিটেইলস পেজ -->
        <div id="productPage" class="card product-details">
            <div class="product-image">
                <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=600&auto=format&fit=crop" alt="হানি লাতে কফি">
            </div>
            <div class="product-info">
                <h2 class="product-title">স্পেশাল ক্যারামেল লাতে</h2>
                <p class="product-description">
                    তাজা রোস্টেড এরোমেটিক কফি বিনস, স্টিমড মিল্ক এবং প্রিমিয়াম ক্যারামেল সিরাপের অসাধারণ মিশ্রণ। আপনার প্রতিদিনের ক্লান্তি দূর করতে এটি একটি নিখুঁত পানীয়।
                </p>
                <div class="product-price">৳ ২৫০</div>
                
                <!-- বাটন গ্রুপ: অর্ডার বাটন ও হোয়াটসঅ্যাপ বাটন -->
                <div class="btn-group">
                    <button class="btn-order" onclick="showCheckout()">Order Now</button>
                    <a href="https://wa.me/8801706712866?text=হ্যালো,%20আমি%20স্পেশাল%20ক্যারামেল%20লাতে%20সম্পর্কে%20জানতে%20চাই।" target="_blank" class="btn-whatsapp">
                        💬 WhatsApp এ যোগাযোগ
                    </a>
                </div>
            </div>
        </div>

        <!-- ২. চেকআউট পেজ -->
        <div id="checkoutPage" class="card checkout-section">
            <button class="btn-back" onclick="showProduct()">← প্রোডাক্ট পেজে ফিরে যান</button>
            <h2 class="section-title">অর্ডার সম্পন্ন করুন (Check Out)</h2>
            
            <form onsubmit="handleOrderSubmit(event)">
                <div class="form-grid">
                    <!-- গ্রাহকের নাম -->
                    <div class="form-group">
                        <label for="fullname">আপনার নাম *</label>
                        <input type="text" id="fullname" placeholder="যেমন: মো: রহিম" required>
                    </div>

                    <!-- মোবাইল নম্বর -->
                    <div class="form-group">
                        <label for="mobile">মোবাইল নম্বর *</label>
                        <input type="tel" id="mobile" placeholder="01706712866" pattern="[0-9]{11}" required>
                    </div>

                    <!-- জেলা -->
                    <div class="form-group">
                        <label for="district">জেলা *</label>
                        <select id="district" required>
                            <option value="">জেলা নির্বাচন করুন</option>
                            <option value="dhaka">ঢাকা</option>
                            <option value="chittagong">চট্টগ্রাম</option>
                            <option value="sylhet">সিলেট</option>
                            <option value="rajshahi">রাজশাহী</option>
                            <option value="khulna">খুলনা</option>
                        </select>
                    </div>

                    <!-- উপজেলা / থানা -->
                    <div class="form-group">
                        <label for="subdistrict">উপজেলা / থানা *</label>
                        <input type="text" id="subdistrict" placeholder="যেমন: ধানমন্ডি" required>
                    </div>

                    <!-- সম্পূর্ণ ডেলিভারি ঠিকানা -->
                    <div class="form-group full-width">
                        <label for="address">বিস্তারিত ডেলিভারি ঠিকানা *</label>
                        <textarea id="address" rows="3" placeholder="বাসা/হোল্ডিং নম্বর, রোড নম্বর, এলাকা বা ল্যান্ডমার্ক বিস্তারিত লিখুন" required></textarea>
                    </div>
                </div>

                <!-- কনফার্ম বাটন -->
                <button type="submit" class="btn-submit">অর্ডার কনফার্ম করুন (৳ ২৫০)</button>
            </form>
        </div>
    </div>

    <!-- ইন্টারঅ্যাকশনের জন্য সিম্পল স্ক্রিপ্ট -->
    <script>
        function showCheckout() {
            document.getElementById('productPage').style.display = 'none';
            document.getElementById('checkoutPage').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showProduct() {
            document.getElementById('checkoutPage').style.display = 'none';
            document.getElementById('productPage').style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleOrderSubmit(e) {
            e.preventDefault();
            alert('ধন্যবাদ! আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে।');
        }
    </script>

</body>
</html>
